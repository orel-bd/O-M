<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>פדיון הבן — אישור הגעה</title>
  <meta name="description" content="הזמנה לסעודת מצווה של פדיון הבן — אישור הגעה">
  <meta property="og:title" content="הוזמנתם לפדיון הבן">
  <meta property="og:description" content="נשמח לראותכם — אשרו הגעה כאן">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Bellefair&family=Frank+Ruhl+Libre:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d6d9de' stroke='%23b48a4a' stroke-width='3'/%3E%3C/svg%3E">
  <script src="config.js"></script>
</head>
<body>
  <main class="wrap one">
    <section class="card one" aria-labelledby="title">

      <!-- ההזמנה -->
      <header class="invite">
        <p class="opening">בשבח והודיה לה׳ יתברך</p>
        <h1 id="title">פדיון הבן</h1>
        <p class="baby" data-baby></p>
        <p class="body">נתכבד להזמינכם לסעודת מצווה של פדיון בננו בכורנו</p>
        <p class="parents" data-parents></p>
        <div class="when-where">
          <div class="ww">
            <p class="ww-main"><span data-day></span><span class="sep">·</span><span data-date></span><span class="sep">·</span><span data-time></span></p>
            <p class="ww-sub" data-hebdate></p>
          </div>
          <div class="ww">
            <p class="ww-main" data-venue></p>
            <p class="ww-sub" data-where></p>
            <p class="parking" data-parking hidden></p>
          </div>
        </div>
      </header>

      <!-- הטופס -->
      <div id="form-view">
        <h2 id="rsvp-title">אישור הגעה</h2>

        <div class="demo hidden" id="demo-note">
          מצב הדגמה: האתר לא רץ על Vercel, לכן האישורים נשמרים רק בדפדפן הזה.
        </div>

        <form id="form" novalidate aria-labelledby="rsvp-title">
          <div class="row2">
            <div class="field">
              <label for="name">שם מלא</label>
              <input id="name" name="name" type="text" autocomplete="name" required maxlength="80">
            </div>
            <div class="field">
              <label for="phone">טלפון</label>
              <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>
            </div>
          </div>

          <div class="field">
            <div class="choice" role="radiogroup" aria-label="האם תגיעו?">
              <input type="radio" id="att-yes" name="attending" value="yes" checked>
              <label for="att-yes">נגיע בשמחה</label>
              <input type="radio" id="att-no" name="attending" value="no">
              <label for="att-no">לא נוכל להגיע</label>
            </div>
          </div>

          <div class="field count-row" id="count-field">
            <span class="label" id="count-label">כמה תהיו? <small>(כולל ילדים)</small></span>
            <div class="stepper" role="group" aria-labelledby="count-label">
              <button type="button" data-step="1" aria-label="הוספה">+</button>
              <output id="count" aria-live="polite">1</output>
              <button type="button" data-step="-1" aria-label="הפחתה">−</button>
            </div>
          </div>

          <div class="field">
            <label for="note">ברכה או הערה <small class="opt">(לא חובה)</small></label>
            <input id="note" name="note" type="text" maxlength="500">
          </div>

          <button class="btn" type="submit" id="submit">שליחת אישור</button>
          <p class="msg" id="msg" role="status"></p>
        </form>
      </div>

      <div id="thanks-view" class="thanks hidden" role="status">
        <div class="seal" aria-hidden="true">✓</div>
        <h2 id="thanks-title">תודה רבה!</h2>
        <p id="thanks-text"></p>
        <button class="linkish" type="button" id="edit">לעדכן את האישור</button>
      </div>

      <p class="verse">
        ״וּפְדוּיָו מִבֶּן חֹדֶשׁ תִּפְדֶּה... חֲמֵשֶׁת שְׁקָלִים״
        <small>במדבר יח, טז</small>
      </p>
    </section>
  </main>

  <script>
  (function () {
    const E = window.EVENT || {};
    const $ = (s) => document.querySelector(s);
    const STORE = 'om-rsvp-mine';
    const DEMO = 'om-rsvp-demo';

    // ---- מילוי פרטי האירוע ----
    $('[data-baby]').textContent = E.babyName ? 'של ' + E.babyName : '';
    $('[data-parents]').textContent = E.parents || '';
    $('[data-day]').textContent = E.day || '';
    $('[data-date]').textContent = E.date || '';
    $('[data-time]').textContent = E.time || '';
    $('[data-hebdate]').textContent = E.hebrewDate || '';
    $('[data-venue]').textContent = E.venue || '';
    const where = $('[data-where]');
    if (E.address) {
      const a = document.createElement(E.mapsUrl ? 'a' : 'span');
      if (E.mapsUrl) { a.href = E.mapsUrl; a.target = '_blank'; a.rel = 'noopener'; }
      a.textContent = E.address + (E.mapsUrl ? ' · ניווט' : '');
      where.append(a);
    }
    if (E.parking) {
      const pk = $('[data-parking]');
      pk.append(E.parking, document.createElement('br'), E.parkingPaid || '');
      if (E.parkingAddress) {
        const a = document.createElement(E.parkingUrl ? 'a' : 'span');
        if (E.parkingUrl) { a.href = E.parkingUrl; a.target = '_blank'; a.rel = 'noopener'; }
        a.textContent = E.parkingAddress;
        pk.append(a);
      }
      pk.hidden = false;
    }
    if (E.babyName) document.title = 'פדיון הבן של ' + E.babyName + ' — אישור הגעה';
    if (!E.apiUrl) $('#demo-note').classList.remove('hidden');

    // ---- כמות ----
    let count = 1;
    const out = $('#count');
    document.querySelectorAll('[data-step]').forEach((b) =>
      b.addEventListener('click', () => {
        count = Math.max(1, Math.min(30, count + Number(b.dataset.step)));
        out.textContent = count;
      })
    );
    const syncAttending = () => {
      const yes = $('#att-yes').checked;
      $('#count-field').classList.toggle('hidden', !yes);
    };
    document.querySelectorAll('[name=attending]').forEach((r) => r.addEventListener('change', syncAttending));

    // ---- שליחה ----
    const form = $('#form'), msg = $('#msg'), btn = $('#submit');
    const err = (t) => { msg.textContent = t; msg.className = 'msg err'; };

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const data = {
        name: $('#name').value.trim(),
        phone: $('#phone').value.replace(/[^\d]/g, ''),
        attending: $('#att-yes').checked ? 'yes' : 'no',
        count: $('#att-yes').checked ? count : 0,
        note: $('#note').value.trim()
      };
      if (!data.name) { err('נא למלא שם מלא'); $('#name').focus(); return; }
      if (!/^0\d{8,9}$/.test(data.phone) && !/^972\d{8,9}$/.test(data.phone)) {
        err('נא למלא מספר טלפון תקין'); $('#phone').focus(); return;
      }

      btn.disabled = true; btn.textContent = 'שולח...'; msg.textContent = '';
      try {
        if (E.apiUrl) {
          const res = await fetch(E.apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          const j = await res.json();
          if (!j.ok) throw new Error(j.error || 'failed');
        } else {
          try {
            const list = JSON.parse(localStorage.getItem(DEMO) || '[]').filter((r) => r.phone !== data.phone);
            list.push({ ...data, time: new Date().toISOString() });
            localStorage.setItem(DEMO, JSON.stringify(list));
          } catch (e) {}
        }
        try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {}
        showThanks(data);
      } catch (e) {
        err('השליחה לא הצליחה. בדקו את החיבור ונסו שוב.');
      } finally {
        btn.disabled = false; btn.textContent = 'שליחת אישור';
      }
    });

    function showThanks(d) {
      $('#form-view').classList.add('hidden');
      $('#thanks-view').classList.remove('hidden');
      if (d.attending === 'yes') {
        $('#thanks-title').textContent = 'תודה רבה, ' + d.name.split(' ')[0] + '!';
        $('#thanks-text').textContent = 'רשמנו ' + (d.count === 1 ? 'משתתף אחד' : d.count + ' משתתפים') + '. מחכים לראותכם!';
      } else {
        $('#thanks-title').textContent = 'תודה שעדכנתם';
        $('#thanks-text').textContent = 'חבל שלא תוכלו להגיע — נשמח בשמחות.';
      }
    }

    $('#edit').addEventListener('click', () => {
      $('#thanks-view').classList.add('hidden');
      $('#form-view').classList.remove('hidden');
      $('#name').focus();
    });

    // ---- אם כבר אישרו מהמכשיר הזה ----
    try {
      const mine = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (mine) {
        $('#name').value = mine.name; $('#phone').value = mine.phone; $('#note').value = mine.note || '';
        $(mine.attending === 'no' ? '#att-no' : '#att-yes').checked = true;
        count = mine.count || 1; out.textContent = count;
        syncAttending();
        showThanks(mine);
      }
    } catch (e) {}
  })();
  </script>
</body>
</html>
